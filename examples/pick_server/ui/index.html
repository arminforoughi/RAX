<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAX Pick</title>
<style>
  :root{--bg:#0e1116;--panel:#161b22;--line:#262d38;--ink:#e6edf3;--dim:#8b96a5;--blue:#3b82f6;--red:#ef4444;--ok:#22c55e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
  header b{font-size:16px} header .arm{color:var(--dim)}
  #phase{margin-left:auto;font-family:ui-monospace,Consolas,monospace;color:var(--blue)}
  main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;padding:16px}
  @media (max-width:900px){main{grid-template-columns:1fr}}
  .view img{width:100%;border-radius:10px;border:1px solid var(--line);background:#000;display:block}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
  .card h3{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input{background:#0b0e13;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
  input[type=text]{flex:1;min-width:0}
  input.num{width:80px}
  button{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  button.stop{background:var(--red)}
  button:disabled{opacity:.45;cursor:default}
  table{width:100%;border-collapse:collapse} td{padding:5px 0;border-top:1px solid var(--line)}
  td:last-child{text-align:right}
  #log{height:260px;overflow:auto;font:12px/1.4 ui-monospace,Consolas,monospace;color:var(--dim);white-space:pre-wrap}
  .ok{color:var(--ok)} .bad{color:var(--red)}
  .warn{color:#f59e0b;font-size:12px;margin-top:6px}
  label{color:var(--dim);font-size:12px}
</style>
</head>
<body>
<header><b>RAX Pick</b><span class="arm" id="arm"></span><span id="phase">…</span></header>
<main>
  <section class="view"><img src="/stream" alt="Wrist camera"></section>
  <aside>
    <div class="card">
      <h3>What to pick</h3>
      <div class="row"><input type="text" id="prompt" placeholder="e.g. cup, red block, screwdriver">
        <button id="set">Set</button></div>
      <div class="warn" id="nohe" hidden>This arm has no hand-eye calibration: scanning and
        distances are off until it is fitted.</div>
    </div>
    <div class="card">
      <h3>Pick</h3>
      <div class="row">
        <label><input type="radio" name="grasp" value="top" checked> from above (90°)</label>
        <label><input type="radio" name="grasp" value="side"> flat to the bed</label>
      </div>
      <div class="row" style="margin-top:8px">
        <label>place at x</label><input class="num" id="px" placeholder="cm">
        <label>y</label><input class="num" id="py" placeholder="cm">
      </div>
      <div class="row" style="margin-top:10px">
        <button id="scan" class="ghost">Scan table</button>
        <button id="pickview">Pick what's in view</button>
      </div>
      <table id="objs"></table>
    </div>
    <div class="card">
      <div class="row"><button class="stop" id="stop">Stop</button>
        <button class="ghost" id="home">Home</button><button class="ghost" id="reset">Reset</button></div>
    </div>
    <div class="card"><h3>Results</h3><table id="res"></table></div>
    <div class="card"><h3>Log</h3><div id="log"></div></div>
  </aside>
</main>
<script>
const $ = id => document.getElementById(id);
const post = (url, body) => fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'},
                                        body: JSON.stringify(body || {})}).then(r => r.json());
const grasp = () => document.querySelector('input[name=grasp]:checked').value;
const placeAt = () => ($('px').value && $('py').value)
  ? [parseFloat($('px').value) / 100, parseFloat($('py').value) / 100] : null;
const doPick = id => post('/pick', {id, grasp: grasp(), place: placeAt()});

$('set').onclick = () => post('/prompt', {prompt: $('prompt').value});
$('prompt').onkeydown = e => { if (e.key === 'Enter') $('set').click(); };
$('scan').onclick = () => post('/scan');
$('pickview').onclick = () => doPick(null);
$('stop').onclick = () => post('/stop');
$('home').onclick = () => post('/home');
$('reset').onclick = () => post('/reset');

let promptSet = false;
async function tick() {
  try {
    const s = await (await fetch('/state')).json();
    $('arm').textContent = s.arm;
    $('phase').textContent = `${s.phase} · ${s.note}`;
    if (!promptSet) { $('prompt').value = s.prompt; promptSet = true; }
    $('nohe').hidden = s.has_handeye;
    for (const b of ['scan', 'pickview', 'home']) $(b).disabled = s.running;
    $('objs').innerHTML = s.objects.map(o =>
      `<tr><td>#${o.id} ${o.label}</td><td>${(o.x * 100).toFixed(0)}, ${(o.y * 100).toFixed(0)} cm</td>` +
      `<td><button ${s.running ? 'disabled' : ''} onclick="doPick(${o.id})">Pick</button></td></tr>`).join('');
    $('res').innerHTML = s.results.slice().reverse().map(r =>
      `<tr><td>${r.t}</td><td>${r.label}</td><td class="${r.ok ? 'ok' : 'bad'}">${r.tag}</td></tr>`).join('');
    const log = $('log'), atEnd = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
    log.textContent = s.log.map(l => `${l.t} ${l.m}`).join('\n');
    if (atEnd) log.scrollTop = log.scrollHeight;
  } catch (e) { $('phase').textContent = 'server not answering'; }
}
setInterval(tick, 700); tick();
</script>
</body>
</html>
