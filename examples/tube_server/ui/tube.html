<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tube handling</title>
<!--
  A page built for ONE job: watching an arm pick a tube up and put it in a rack.

  It is not a copy of the mission server's admin page. That page is a control panel for
  a research rig — 40-odd buttons, every calibration route, the whole knob table — and
  it is the right shape for what it does. This is the wrong shape for that and the right
  shape for tubes: the 3D scene IS the page, because the question an operator actually
  has is "where does it think the tube is, and is the hand going there", and that
  question is spatial. Everything else is a strip down the side.

  THE SCENE IS ARM-AGNOSTIC. It fetches /urdf for triangles and /geom for a 4x4 per
  link and knows nothing about which robot it is drawing — SO-101 STL meshes and X250
  primitives render through the same path. Tubes draw as capped cylinders at their
  mapped position, racks as hole grids on the table.
-->
<style>
  :root{
    --bg:#0e1116; --panel:#161b23; --line:#242c38; --ink:#e6ecf4; --dim:#93a1b5;
    --accent:#4da3ff; --ok:#3fc46b; --warn:#e0b040; --bad:#e2574c;
    --sim:#b07cd8;
    color-scheme: dark;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.45 ui-sans-serif,system-ui,'Segoe UI',sans-serif;}
  h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
  .wrap{display:grid;grid-template-columns:1fr 320px;gap:12px;
        padding:12px;min-height:100dvh;align-items:start}
  @media (max-width:860px){ .wrap{grid-template-columns:1fr} }

  /* ---- the stage ---- */
  .stage{position:relative;background:#0a0d12;border:1px solid var(--line);
         border-radius:12px;overflow:hidden;aspect-ratio:4/3;min-height:340px}
  canvas#scene{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  .badge{position:absolute;top:10px;left:10px;display:flex;gap:6px;align-items:center;
         flex-wrap:wrap;max-width:calc(100% - 20px)}
  .chip{background:#0e131bcc;border:1px solid var(--line);border-radius:999px;
        padding:3px 10px;font-size:11px;color:var(--dim);backdrop-filter:blur(6px)}
  .chip b{color:var(--ink);font-weight:600}
  .chip.sim{border-color:var(--sim);color:#e2cdf5}
  .phase{position:absolute;bottom:10px;left:10px;right:10px;
         background:#0e131bd9;border:1px solid var(--line);border-radius:10px;
         padding:8px 11px;backdrop-filter:blur(6px);display:flex;gap:10px;
         align-items:baseline;flex-wrap:wrap}
  .phase .p{font:600 12px ui-monospace,Consolas,monospace;letter-spacing:.6px;
            color:var(--accent)}
  .phase .n{font-size:12px;color:var(--dim);flex:1;min-width:120px}
  .hint{position:absolute;top:10px;right:10px;font-size:10px;color:#5d6b7e}

  /* ---- side ---- */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;
         padding:12px;margin-bottom:12px}
  .panel h2{font-size:11px;text-transform:uppercase;letter-spacing:.9px;
            color:var(--dim);margin:0 0 9px;font-weight:600}
  .row{display:flex;gap:7px;flex-wrap:wrap}
  button{flex:1 1 auto;min-width:64px;background:#1e2633;color:var(--ink);
         border:1px solid var(--line);border-radius:8px;padding:8px 10px;
         font:inherit;font-size:13px;cursor:pointer}
  button:hover:not(:disabled){background:#28323f;border-color:#37435400}
  button:disabled{opacity:.42;cursor:default}
  button.go{background:#1b4a7a;border-color:#2b6ba8}
  button.go:hover:not(:disabled){background:#22598f}
  button.stop{background:#5c2420;border-color:#8a3630}
  select{width:100%;background:#1e2633;color:var(--ink);border:1px solid var(--line);
         border-radius:8px;padding:8px;font:inherit}

  table.tubes{width:100%;border-collapse:collapse;font-size:12px}
  table.tubes th{text-align:left;color:var(--dim);font-weight:500;font-size:10px;
                 text-transform:uppercase;letter-spacing:.6px;padding:0 0 5px}
  table.tubes td{padding:4px 0;border-top:1px solid #1d242e}
  table.tubes tr.sel td{background:#182230}
  table.tubes tr{cursor:pointer}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;
       margin-right:6px;vertical-align:-1px}
  .src{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:#6d7b8e}
  .src.seen{color:var(--ok)} .src.assumed{color:var(--warn)}

  .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px}
  .kv dt{color:var(--dim)} .kv dd{margin:0;font-family:ui-monospace,Consolas,monospace}
  .held-y{color:var(--ok)} .held-n{color:var(--dim)}

  #log{font:11px/1.5 ui-monospace,Consolas,monospace;color:#8fa0b4;
       max-height:190px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
  #log div{padding:1px 0}
  #log .t{color:#4f5d6f;margin-right:6px}
  .warnbar{background:#2a1f33;border:1px solid var(--sim);color:#e2cdf5;
           border-radius:10px;padding:8px 11px;font-size:12px;margin-bottom:12px}
</style>

<div class="wrap">
  <div>
    <div id="simbar" class="warnbar" hidden></div>
    <div class="stage">
      <canvas id="scene"></canvas>
      <div class="badge">
        <span class="chip">arm <b id="c-arm">—</b></span>
        <span class="chip">grip <b id="c-grip">—</b></span>
        <span class="chip" id="c-held">—</span>
        <span class="chip" id="c-sim" hidden>simulated</span>
      </div>
      <div class="hint">drag to orbit · scroll to zoom</div>
      <div class="phase">
        <span class="p" id="c-phase">IDLE</span>
        <span class="n" id="c-note"></span>
        <span class="chip" id="c-tally">—</span>
      </div>
    </div>
  </div>

  <aside>
    <div class="panel">
      <h2>Pick a tube</h2>
      <table class="tubes">
        <thead><tr><th>Tube</th><th>Where</th><th></th></tr></thead>
        <tbody id="tubes"></tbody>
      </table>
    </div>

    <div class="panel">
      <h2>Put it in</h2>
      <select id="rack"></select>
      <div class="row" style="margin-top:9px">
        <button class="go" id="b-pick">Pick &amp; place</button>
        <button class="stop" id="b-stop">Stop</button>
      </div>
      <div class="row" style="margin-top:7px">
        <button id="b-reset">Reset</button>
      </div>
    </div>

    <div class="panel">
      <h2>Gripper</h2>
      <dl class="kv">
        <dt>reading</dt><dd id="k-grip">—</dd>
        <dt>verdict</dt><dd id="k-held">—</dd>
      </dl>
      <div id="k-detail" style="font-size:11px;color:var(--dim);margin-top:7px"></div>
    </div>

    <div class="panel">
      <h2>Log</h2>
      <div id="log"></div>
    </div>
  </aside>
</div>

<script>
const $ = id => document.getElementById(id);
const CAPCOL = {green:'#3fc46b', blue:'#4da3ff', gold:'#e0b040', red:'#e2574c'};
let G = {xf:{}, tubes:[], racks:[], joints:[]};
let mesh = null, sel = null, userPickedRack = false;

/* ---------------- 3D ---------------- */
const cv = $('scene'), ctx = cv.getContext('2d');
let az = -0.62, el = 0.52, zoom = 1.0;

function resize(){
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width*dpr); cv.height = Math.round(r.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize', ()=>{resize(); draw();});

// What the camera is aimed AT, and it is deliberately not the base. Framing on the
// origin puts the arm — half a metre of it at the retracted look pose — straight up the
// middle of the canvas while the actual work happens on the bench at the bottom edge.
// The interesting volume is the reachable table in front of the robot, so the view
// centres there and the arm leans into frame from behind it.
const LOOKAT = [0.15, 0.0, 0.13];
//: metres across the short edge of the canvas at zoom 1. Wide enough for the base, both
//: racks and a raised arm together.
const SPAN = 0.95;

// base-frame point -> screen. z is up. Also returns view depth for painter's sort.
function proj(p){
  const ca=Math.cos(az), sa=Math.sin(az), ce=Math.cos(el), se=Math.sin(el);
  const x=p[0]-LOOKAT[0], y=p[1]-LOOKAT[1], z=p[2]-LOOKAT[2];
  const rx = -x*sa + y*ca;
  const dep =  x*ca + y*sa;
  const uy =  z*ce - dep*se;
  const W=cv.clientWidth, H=cv.clientHeight, s=Math.min(W,H)/SPAN*zoom;
  return [W*0.5 + s*rx, H*0.52 - s*uy, dep*ce + z*se];
}
function line(a,b,col,w){
  const p=proj(a), q=proj(b);
  ctx.strokeStyle=col; ctx.lineWidth=w||1;
  ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(q[0],q[1]); ctx.stroke();
}

const LINKCOL = {
  base_link:[74,80,90], shoulder_link:[100,120,153], upper_arm_link:[110,133,168],
  forearm_link:[100,120,153], wrist_link:[118,140,175], gripper_link:[189,199,214],
  left_finger_link:[210,218,230], right_finger_link:[210,218,230],
  // SO-101 link names, so the same page draws it too
  moving_jaw_so101_v1_link:[225,232,241], lower_arm_link:[100,140,200]
};

function armTris(out){
  if(!mesh) return;
  const ca=Math.cos(az), sa=Math.sin(az), ce=Math.cos(el), se=Math.sin(el);
  const vdx=ca*ce, vdy=sa*ce, vdz=se;
  for(const L of mesh){
    const T = G.xf[L.name]; if(!T) continue;
    const nv = L.v.length/3;
    const bx=new Float64Array(nv), by=new Float64Array(nv), bz=new Float64Array(nv);
    const sx=new Float64Array(nv), sy=new Float64Array(nv), sd=new Float64Array(nv);
    for(let i=0;i<nv;i++){
      const x=L.v[3*i], y=L.v[3*i+1], z=L.v[3*i+2];
      const X=T[0]*x+T[1]*y+T[2]*z+T[3];   // row-major 4x4
      const Y=T[4]*x+T[5]*y+T[6]*z+T[7];
      const Z=T[8]*x+T[9]*y+T[10]*z+T[11];
      bx[i]=X; by[i]=Y; bz[i]=Z;
      const s=proj([X,Y,Z]); sx[i]=s[0]; sy[i]=s[1]; sd[i]=s[2];
    }
    const c = LINKCOL[L.name] || [130,148,175];
    for(let t=0;t<L.f.length;t+=3){
      const a=L.f[t], b=L.f[t+1], q=L.f[t+2];
      const ux=bx[b]-bx[a], uy=by[b]-by[a], uz=bz[b]-bz[a];
      const vx=bx[q]-bx[a], vy=by[q]-by[a], vz=bz[q]-bz[a];
      let nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx;
      const nl=Math.hypot(nx,ny,nz)||1; nx/=nl; ny/=nl; nz/=nl;
      // Backface cull. The mesh is wound outward (urdf_visuals guarantees it and a
      // signed-volume test pins it), so drawing both sides would paint the inside of
      // the arm over the outside — which reads as "the robot looks like glass".
      if(nx*vdx + ny*vdy + nz*vdz >= 0) continue;
      const lam = Math.max(0.42, Math.min(1.12, 0.52 + 0.62*(0.42*nx - 0.38*ny + 0.84*nz)));
      out.push([(sd[a]+sd[b]+sd[q])/3, sx[a],sy[a],sx[b],sy[b],sx[q],sy[q],
                `rgb(${c[0]*lam|0},${c[1]*lam|0},${c[2]*lam|0})`]);
    }
  }
}

// A tube: a capped cylinder standing on the table (or held, wherever the hand is).
function tubeTris(out, t){
  const N=10, r=(t.d||0.016)/2, h=(t.l||0.1);
  const col = CAPCOL[t.colour] || '#9aa7b8';
  const body = t.held ? 0.95 : 0.78;
  for(let i=0;i<N;i++){
    const a0=2*Math.PI*i/N, a1=2*Math.PI*(i+1)/N;
    const p=[ [t.x+r*Math.cos(a0), t.y+r*Math.sin(a0), t.z],
              [t.x+r*Math.cos(a1), t.y+r*Math.sin(a1), t.z],
              [t.x+r*Math.cos(a1), t.y+r*Math.sin(a1), t.z+h],
              [t.x+r*Math.cos(a0), t.y+r*Math.sin(a0), t.z+h] ];
    const s=p.map(proj);
    const lam = body*(0.55+0.45*Math.cos(a0+az));
    const rgb = hexrgb(col).map(v=>Math.min(255, v*lam)|0);
    const d=(s[0][2]+s[2][2])/2;
    out.push([d, s[0][0],s[0][1], s[1][0],s[1][1], s[2][0],s[2][1], `rgb(${rgb})`]);
    out.push([d, s[0][0],s[0][1], s[2][0],s[2][1], s[3][0],s[3][1], `rgb(${rgb})`]);
  }
  // the cap, brighter, so colour is readable from any angle
  const top=[]; for(let i=0;i<N;i++){const a=2*Math.PI*i/N;
    top.push(proj([t.x+r*1.15*Math.cos(a), t.y+r*1.15*Math.sin(a), t.z+h+0.004]));}
  for(let i=1;i+1<N;i++)
    out.push([top[0][2], top[0][0],top[0][1], top[i][0],top[i][1],
              top[i+1][0],top[i+1][1], col]);
}
function hexrgb(h){ return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16)); }

function draw(){
  const W=cv.clientWidth, H=cv.clientHeight;
  ctx.clearRect(0,0,W,H);

  // table grid
  const g=0.36, n=9; ctx.globalAlpha=.55;
  for(let i=0;i<=n;i++){ const t=-g+2*g*i/n;
    line([t,-g,0],[t,g,0],'#1d2531',1); line([-g,t,0],[g,t,0],'#1d2531',1); }
  ctx.globalAlpha=1;
  // base axes
  line([0,0,0],[0.09,0,0],'#c9524a',2);
  line([0,0,0],[0,0.09,0],'#4a93c9',2);
  line([0,0,0],[0,0,0.09],'#4ac275',2);

  // racks: outline + every hole, filled when occupied
  for(const r of (G.racks||[])){
    const occupied = new Set((G.tubes||[]).filter(t=>t.rack===r.name && t.hole!=null)
                                          .map(t=>t.hole));
    r.holes.forEach((h,i)=>{
      const pts=[]; for(let k=0;k<10;k++){const a=2*Math.PI*k/10;
        pts.push(proj([h[0]+0.009*Math.cos(a), h[1]+0.009*Math.sin(a), 0.001]));}
      ctx.beginPath(); pts.forEach((p,k)=>k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
      ctx.closePath();
      ctx.fillStyle = occupied.has(i) ? '#2b3440' : '#0c1016';
      ctx.fill(); ctx.strokeStyle=r.colour; ctx.lineWidth=1.2; ctx.stroke();
    });
    const c=proj([r.x, r.y, 0]);
    ctx.fillStyle=r.colour; ctx.font='10px ui-monospace,Consolas';
    ctx.fillText(r.name, c[0]-9, c[1]+26);
  }

  // one painter's-sorted pass over arm + tubes, so a tube in the jaws occludes right
  const tris=[]; armTris(tris);
  for(const t of (G.tubes||[])) tubeTris(tris, t);
  tris.sort((a,b)=>b[0]-a[0]);
  for(const t of tris){
    ctx.fillStyle=t[7]; ctx.strokeStyle=t[7]; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(t[1],t[2]); ctx.lineTo(t[3],t[4]); ctx.lineTo(t[5],t[6]);
    ctx.closePath(); ctx.fill(); ctx.stroke();   // stroke seals sub-pixel seams
  }

  // labels last, always legible
  for(const t of (G.tubes||[])){
    const s=proj([t.x,t.y,t.z+(t.l||0.1)+0.03]);
    ctx.fillStyle = (sel===t.id) ? '#fff' : '#8fa0b4';
    ctx.font = (sel===t.id ? '600 ' : '') + '10px ui-monospace,Consolas';
    ctx.fillText(`#${t.id} ${t.colour}`, s[0]+6, s[1]);
  }
  if(!mesh && !Object.keys(G.xf||{}).length){
    ctx.fillStyle='#5d6b7e'; ctx.font='12px ui-sans-serif';
    ctx.fillText('waiting for the arm description…', 14, 22);
  }
}

// orbit + zoom
let drag=null;
cv.addEventListener('pointerdown', e=>{drag=[e.clientX,e.clientY];
  cv.setPointerCapture(e.pointerId); cv.style.cursor='grabbing';});
cv.addEventListener('pointermove', e=>{ if(!drag) return;
  az -= (e.clientX-drag[0])*0.01; el += (e.clientY-drag[1])*0.01;
  el = Math.max(-0.25, Math.min(1.45, el)); drag=[e.clientX,e.clientY]; draw();});
cv.addEventListener('pointerup', ()=>{drag=null; cv.style.cursor='grab';});
cv.addEventListener('wheel', e=>{ e.preventDefault();
  zoom = Math.max(0.45, Math.min(2.6, zoom * (e.deltaY>0?0.92:1.08))); draw();},
  {passive:false});

/* ---------------- data ---------------- */
fetch('/urdf').then(r=>r.json()).then(d=>{
  mesh = (d.links||[]).map(L=>({name:L.name, v:Float32Array.from(L.v),
                                f:Int32Array.from(L.f)}));
  if(!mesh.length) mesh=null;
  draw();
}).catch(()=>{});

function renderTubes(){
  const tb=$('tubes'); tb.innerHTML='';
  for(const t of (G.tubes||[])){
    const tr=document.createElement('tr');
    if(sel===t.id) tr.className='sel';
    const where = t.held ? 'in the jaws'
                : t.rack ? `${t.rack} hole ${t.hole}`
                : `${(Math.hypot(t.x,t.y)*100).toFixed(0)} cm out`;
    tr.innerHTML =
      `<td><span class="dot" style="background:${CAPCOL[t.colour]||'#8a93a0'}"></span>`
      + `#${t.id} ${t.colour}</td><td>${where}</td>`
      + `<td><span class="src ${t.source}">${t.source}</span></td>`;
    tr.onclick = ()=>{ sel=t.id; renderTubes(); draw(); };
    tb.appendChild(tr);
  }
  if(sel===null && (G.tubes||[]).length){ sel=G.tubes[0].id; }
}

function renderRacks(){
  const s=$('rack');
  if(s.options.length === (G.racks||[]).length+1) return;   // don't fight the operator
  const keep = s.value;
  s.innerHTML='<option value="">hold it (do not place)</option>';
  for(const r of (G.racks||[])){
    const o=document.createElement('option'); o.value=r.name;
    const free = r.holes.length - (G.tubes||[])
      .filter(t=>t.rack===r.name && t.hole!=null).length;
    o.textContent = `${r.name} rack — ${free} free`;
    s.appendChild(o);
  }
  if(keep) s.value = keep;
  else if((G.racks||[]).length) s.value = G.racks[0].name;
}

async function pollGeom(){
  try{
    G = await (await fetch('/geom')).json();
    $('c-arm').textContent = G.arm || '—';
    $('c-phase').textContent = G.phase || 'IDLE';
    $('c-note').textContent = G.note || '';
    const simChip=$('c-sim'), bar=$('simbar');
    simChip.hidden = !G.simulated;
    if(G.simulated){
      simChip.className='chip sim';
      bar.hidden=false;
      bar.textContent = 'Simulated — the kinematics and the arm description are real, '
        + 'the arm’s responses and the tube positions are not. Nothing here is '
        + 'evidence about the hardware.';
    } else { bar.hidden=true; }
    renderTubes(); renderRacks(); draw();
  }catch(e){}
}

async function pollState(){
  try{
    const s = await (await fetch('/state')).json();
    $('c-grip').textContent = s.gripper;
    $('k-grip').textContent = s.gripper;
    const h=$('c-held'); h.textContent = s.held ? 'holding' : 'empty';
    h.className = 'chip ' + (s.held ? 'held-y' : 'held-n');
    const kh=$('k-held'); kh.textContent = s.held ? 'holding' : 'empty';
    kh.className = s.held ? 'held-y' : 'held-n';
    $('k-detail').textContent = s.grip_detail || '';
    const t=s.episodes||{};
    $('c-tally').textContent = t.runs
      ? `${t.ok}/${t.runs} picks · ${t.mean_tries.toFixed(1)} tries`
      : 'no runs yet';
    $('b-pick').disabled = !!s.running;
    $('b-stop').disabled = !s.running;
    const lg=$('log'); lg.innerHTML='';
    for(const e of (s.log||[]).slice(-60))
      lg.insertAdjacentHTML('afterbegin',
        `<div><span class="t">${e.t}</span>${e.m.replace(/[<&]/g,c=>({'<':'&lt;','&':'&amp;'}[c]))}</div>`);
  }catch(e){}
}

const post = (u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},
                            body:JSON.stringify(b||{})});
$('b-pick').onclick = ()=>{ if(sel===null) return;
  post('/pick', {tube: sel, rack: $('rack').value || null}); };
$('b-stop').onclick  = ()=> post('/stop');
$('b-reset').onclick = ()=> post('/reset');

resize(); pollGeom(); pollState();
setInterval(pollGeom, 120);
setInterval(pollState, 600);
</script>
