name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The whole suite runs with no robot, no camera and no model weights — that is
    # the property being protected here. If a change makes the tests need hardware,
    # this job is where it should become obvious.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Headless runners have no GL stack; the -headless wheel is the same
          # OpenCV without the GUI bindings nothing in the test path uses.
          pip install opencv-python-headless
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

      - name: Pick an object with no hardware at all
        # The published entry point, on the two rigs a new user is most likely to
        # have. A green suite with a broken CLI would be the worst outcome here.
        run: |
          python -m rax.grasp --arm head_mono --query "red object" --survey-frames 6 --settle 0
          python -m rax.grasp --arm mock --query "green object" --survey-frames 6 --settle 0
