[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rax"
version = "0.1.0"
description = "Approach and grasp with an arm and a camera you already own"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["robotics", "manipulation", "grasping", "visual-servoing", "so-101"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The core stack localizes, plans and drives an arm. It needs numeric and image
# primitives and nothing else — no deep learning framework, no vendor SDK, no ROS.
# That is deliberate: `pip install rax` on a laptop with a webcam has to work, and
# every heavy thing below is an optional upgrade to a pipeline that already runs.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python>=4.8",
]

[project.optional-dependencies]
# Open-vocabulary detection. Without it the colour-blob and foreground-blob
# detectors still work, which is enough for the demos and for coloured objects.
detect = ["ultralytics>=8.3"]
# Learned stereo matchers. SGBM ships with OpenCV and is the automatic fallback.
stereo = ["torch>=2.1"]
# Per-vendor camera SDKs. Pick the one you own; none are needed for a webcam.
realsense = ["pyrealsense2>=2.54"]
oakd = ["depthai>=2.24"]
# OPTIONAL accelerator. URDF kinematics work out of the box on the numpy backend;
# placo is a better solver near singularities, and publishes no wheels on Windows.
kinematics = ["placo>=0.9"]
dev = ["pytest>=8.0", "ruff>=0.6"]
# Everything a full SO-101 + OAK-D rig uses.
all = ["rax[detect,stereo,oakd,kinematics]"]

[project.scripts]
rax-grasp = "rax.grasp:main"

[project.urls]
Homepage = "https://github.com/arminforoughi/RAX"
Issues = "https://github.com/arminforoughi/RAX/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The URDF ships: without it `--arm so101` resolves a profile whose kinematics file
# does not exist in an installed copy. The STL meshes deliberately do NOT ship — they
# are 17 MB and only the optional Rerun viewer reads them, so an installed rax falls
# back to a mesh-less view rather than tripling the wheel.
"rax" = ["py.typed", "robots/arms/lerobot_so101/SO101/*.urdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Quiet by default; -v when a failure needs the detail.
addopts = "-q"

[tool.ruff]
line-length = 96
src = ["src", "tests"]
extend-exclude = ["examples/legacy", "SO101"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # long lines are usually prose in a docstring here
    "B008",   # argparse/dataclass defaults built in the signature are intentional
    # The rules below flag existing style, not defects. Turning them on would mean a
    # mechanical sweep over code that is currently correct and well commented, and
    # B905 in particular changes behaviour: strict=True raises where the code today
    # tolerates a length mismatch. Enable them deliberately, with tests, not as part
    # of a packaging pass.
    "B905",   # zip() without strict=
    "E741",   # `l` as a variable name, in URDF/label parsing loops
    "E702",   # semicolon-separated statements, in one older test file
]
