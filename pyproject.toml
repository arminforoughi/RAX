[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rax"
version = "0.2.0"
description = "Pick up any object a camera can see, with no training"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["robotics", "manipulation", "grasping", "visual-servoing", "so-101"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The method needs numeric and image primitives and nothing else: no deep learning
# framework, no vendor SDK, no ROS. The simulator and the tests run on a laptop.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python>=4.8",
]

[project.optional-dependencies]
# Open-vocabulary detection for PromptTarget ("cup", "screwdriver", ...).
detect = ["ultralytics>=8.3"]
# The real SO-101 + wrist OAK-D, and the tube-sorting server.
robot = ["lerobot", "depthai>=2.24", "flask>=3.0", "requests>=2.31"]
# Optional faster IK backend near singularities (no Windows wheels).
kinematics = ["placo>=0.9"]
dev = ["pytest>=8.0", "ruff>=0.6"]
all = ["rax[detect,robot,kinematics]"]

[project.urls]
Homepage = "https://github.com/arminforoughi/RAX"
Issues = "https://github.com/arminforoughi/RAX/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The URDF ships; the STL meshes (17 MB) only feed the 3D view and do not.
"rax" = ["py.typed", "robots/so101_model/*.urdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Quiet by default; -v when a failure needs the detail.
addopts = "-q"

[tool.ruff]
line-length = 96
src = ["src", "tests"]
extend-exclude = ["examples/legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # long lines are usually prose in a docstring here
    "B008",   # argparse/dataclass defaults built in the signature are intentional
    "B905",   # zip() without strict=
    "E741",   # `l` as a variable name, in URDF parsing loops
]
